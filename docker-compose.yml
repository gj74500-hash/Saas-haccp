services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://haccp:haccp@db:5432/haccp_pro?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: haccp
      POSTGRES_PASSWORD: haccp
      POSTGRES_DB: haccp_pro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haccp -d haccp_pro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
